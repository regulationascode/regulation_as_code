name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
      - run: npm test
      - run: npm run examples:export
      - run: git diff --exit-code -- examples/
