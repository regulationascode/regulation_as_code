name: Bug report
description: Report behavior using synthetic values
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the page or action, expected outcome, and actual outcome.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include sample steps or invented values only. Do not share institution data.
    validations:
      required: true
