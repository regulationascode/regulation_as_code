name: Regulation catalog CI

on:
  pull_request:
    branches: [main]
    paths:
      - "catalog/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regulation-catalog-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Catalog validation, synthetic tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate machine-readable catalog
        run: pnpm run validate:catalog

      - name: Test synthetic timing branches
        run: pnpm test

      - name: Typecheck and build
        run: pnpm run build
